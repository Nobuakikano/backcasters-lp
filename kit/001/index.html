<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>投稿キット 第1回｜ひとりでやらない実家じまい</title>
<style>
/* 1列のスマホ用手順。上から順に押すだけ */
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2622;--muted:#5d6861;--green:#2b3a2f;--gold:#b98a4a;--line:#e2ded3;--ok:#2f7d4f}
@media (prefers-color-scheme: dark){:root{--bg:#141a16;--card:#1e2620;--ink:#e9ece7;--muted:#a3ada6;--green:#e6c99a;--gold:#e6c99a;--line:#2e3831;--ok:#7fd0a0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.7;
 padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;display:grid;gap:16px}
h1{font-size:20px;margin:0;line-height:1.5}
.sub{color:var(--muted);font-size:13px;margin:0}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.step h2{margin:0;font-size:17px;display:flex;align-items:center;gap:10px}
.step h2 b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px}
.step p{margin:0;font-size:14px;color:var(--muted)}
button,.btn{appearance:none;border:0;border-radius:12px;background:var(--green);color:var(--bg);font:inherit;font-weight:700;font-size:17px;padding:15px 16px;width:100%;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn2{background:transparent;color:var(--green);border:2px solid var(--green);font-size:15px;padding:11px 14px}
button.done{background:var(--ok)}
.media{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.media video,.media img{width:110px;border-radius:10px;display:block;background:#000}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;background:var(--bg);color:var(--ink)}
.msg{font-size:13px;color:var(--ok);min-height:1.2em;margin:0}
.row{display:grid;gap:8px}
</style>
</head>
<body>
<main>
  <header>
    <h1>第1回　実家を一度貸すと、税金が約462万円変わる</h1>
    <p class="sub">Instagram（リール）投稿キット ／ iPhoneはSafariで開いてください</p>
  </header>

  <section class="step">
    <h2><b>1</b>カバー画像を保存</h2>
    <div class="media">
      <img src="cover.jpg" alt="カバー画像：462万円">
      <p>あとで投稿画面の「カバーを編集」→「カメラロールから追加」で選びます。</p>
    </div>
    <button id="sc" class="btn2" type="button" data-file="cover.jpg" data-type="image/jpeg" data-name="jikka_001_cover.jpg">カバー画像を写真に保存</button>
    <p class="msg" id="scmsg"></p>
  </section>

  <section class="step">
    <h2><b>2</b>キャプションをコピー</h2>
    <button id="copy" type="button">キャプションをコピーする</button>
    <p class="msg" id="copymsg"></p>
    <textarea id="cap" readonly>相続した実家を2,500万円で売る。同じ家、同じ値段でも、税金が約462万円変わることがあります（仮の例）。

違いは、売る前に一度、人に貸したかどうか。

親がひとりで住んでいた家を相続して売ると、売って出た利益から最大3,000万円を差し引ける特例があります。ただしこの特例は、相続してから売るまでのあいだに、人に貸したり事業に使ったりすると使えなくなります。

「しばらく貸して、家賃をもらってから売ろう」と考えている方は、貸す前に一度、売った場合の税金を計算しておく価値があります。

貸す前に確かめたいこと
・1981年5月31日以前に建てられた家か
・亡くなる直前まで、親がひとりで住んでいたか
・相続した年から数えて3年目の年末までに売れるか

計算の前提
・売れた金額2,500万円、親が買った値段は不明（売れた金額の5％とみなす）、売るための費用100万円、税率20.315％
・すべて説明のための仮の数字です
・特例の適用期限は2027年12月31日までの売却（延長は国が要望中で未定）
・相続人が3人以上の場合、1人あたりの上限は2,000万円

親が大切にしてきた家だからこそ、慌てずに、順番を間違えずに決めてほしい。そう思って、この計算を書きました。

計算の中身は、プロフィールのリンクからどうぞ。実際の判断は、税理士や税務署にご確認ください。

※広告を含みます

#実家じまい #相続 #空き家 #相続税 #親の家 #50代 #終活</textarea>
  </section>

  <section class="step">
    <h2><b>3</b>動画をInstagramに送る</h2>
    <div class="media">
      <video src="video_music.mp4" poster="cover.jpg" muted playsinline loop autoplay></video>
      <p>ボタンを押す →「Instagram」→「リール」を選ぶ。<br>文章入力欄で<strong>長押し→ペースト</strong>。カバーは手順1の画像を選ぶ。</p>
    </div>
    <div class="row">
      <button id="sv1" type="button" data-file="video_music.mp4" data-type="video/mp4" data-name="jikka_001.mp4">音楽つきの動画を送る</button>
      <button id="sv2" class="btn2" type="button" data-file="video_silent.mp4" data-type="video/mp4" data-name="jikka_001_nomusic.mp4">音楽なし（Instagramで曲を選ぶ）</button>
    </div>
    <p class="msg" id="svmsg"></p>
  </section>

  <p class="sub">共有がうまくいかないときは、<a href="video_music.mp4">動画を開く</a>／<a href="cover.jpg">画像を開く</a> から長押しで保存してください。</p>
</main>
<script>
const $=id=>document.getElementById(id);
$('copy').addEventListener('click',async()=>{
  const t=$('cap').value;
  try{await navigator.clipboard.writeText(t);ok()}catch(e){
    const a=$('cap');a.removeAttribute('readonly');a.focus();a.select();a.setSelectionRange(0,t.length);
    try{document.execCommand('copy');ok()}catch(_){$('copymsg').textContent='下の文章を長押しして「すべてを選択」→「コピー」してください'}
    a.setAttribute('readonly','')}
  function ok(){$('copy').textContent='コピーしました';$('copy').classList.add('done');$('copymsg').textContent='このあと手順3へ'}
});
async function share(btn,msgId){
  const m=$(msgId);m.textContent='準備中…';
  try{
    const r=await fetch(btn.dataset.file);const b=await r.blob();
    const f=new File([b],btn.dataset.name,{type:btn.dataset.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});m.textContent='送りました';}
    else{m.textContent='この画面では共有できません。下の「動画を開く」から長押しで保存してください';location.href=btn.dataset.file}
  }catch(e){m.textContent=(e&&e.name==='AbortError')?'':'うまくいきませんでした。もう一度押してください'}
}
['sv1','sv2','sc'].forEach(id=>$(id).addEventListener('click',()=>share($(id),id==='sc'?'scmsg':'svmsg')));
</script>
</body>
</html>
